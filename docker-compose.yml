networks:
  app-net:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  kafka-data:

services:
  # =========================
  # POSTGRES
  # =========================
  postgres:
    image: postgres:14
    container_name: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      retries: 5
      timeout: 5s

  # =========================
  # KAFKA (KRaft)
  # =========================
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 5s


  kafka-init:
    image: apache/kafka:3.7.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic bitcoin_prices --partitions 1 --replication-factor 1
      "
    networks:
      - app-net

  # =========================
  # MINIO
  # =========================
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10


  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/crypto-raw || true
      "
    networks:
      - app-net


  # =========================
  # AIRFLOW INIT
  # =========================
  airflow-init:
    image: apache/airflow:2.9.2
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://user:pass@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: NPjYzKsfySa5xNfbqJTvesOetfAy2gPRWHftjO7Wd84=
    command: >
      bash -c "
        airflow db init &&
        airflow users create --username admin --firstname Admin --lastname Admin --role Admin --email admin@example.org --password admin
      "
    networks:
      - app-net



  # =========================
  # AIRFLOW
  # =========================
  airflow-webserver:
    image: apache/airflow:2.9.2
    container_name: airflow-webserver
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://user:pass@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: NPjYzKsfySa5xNfbqJTvesOetfAy2gPRWHftjO7Wd84=
      PYTHONPATH: /opt/airflow/project
    volumes:
      - ./:/opt/airflow/project
      - ./dags:/opt/airflow/dags
    ports:
      - "8080:8080"
    command: >
      bash -c "
        pip install --no-cache-dir kafka-python &&
        airflow webserver
      "
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      retries: 10

  airflow-scheduler:
    image: apache/airflow:2.9.2
    container_name: airflow-scheduler
    depends_on:
      airflow-webserver:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://user:pass@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: NPjYzKsfySa5xNfbqJTvesOetfAy2gPRWHftjO7Wd84=
      PYTHONPATH: /opt/airflow/project
    volumes:
      - ./:/opt/airflow/project
      - ./dags:/opt/airflow/dags
    command: >
      bash -c "
        pip install --no-cache-dir kafka-python &&
        airflow scheduler
      "
    networks:
      - app-net

  # =========================
  # SPARK
  # =========================
  spark-master:
    build:
      context: .
      dockerfile: dockerfile.spark
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8082:8080"
    volumes:
      - ./:/opt/project
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://localhost:8080/ | grep 'Spark Master' > /dev/null"]
      interval: 10s
      retries: 5
      start_period: 20s


  spark-worker:
    build:
      context: .
      dockerfile: dockerfile.spark
    container_name: spark-worker
    depends_on:
      spark-master:
        condition: service_healthy
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    volumes:
      - ./:/opt/project
    networks:
      - app-net

  spark-submit:
    build:
      context: .
      dockerfile: dockerfile.spark
    container_name: spark-submit
    depends_on:
      - spark-master
      - kafka
      - minio
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --py-files /opt/project/src
      /opt/project/src/consumer/spark_consumer.py
    volumes:
      - ./:/opt/project
    environment:
      - PYTHONPATH=/opt/project
    networks:
      - app-net



  # =========================
  # SUPERSET
  # =========================
  superset:
    image: my-superset-final:latest # <--- Đổi tên để ép build mới
    container_name: superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: supersecret
      TALISMAN_ENABLED: "False"
    depends_on:
      - postgres
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/health || exit 1"]
      interval: 10s
      retries: 10

  # =========================
  # REDPANDA CONSOLE
  # =========================
  redpanda-console:
    image: redpandadata/console:latest
    container_name: redpanda-console
    ports:
      - "8081:8080"
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - app-net

